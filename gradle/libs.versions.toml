[versions]
# Pinned exactly: patches are diffs against Vineflower's output, so a different
# decompiler version means different vendor source and patches that no longer apply.
vineflower = "1.12.0"
teavm = "0.16.0"
# Must match the LWJGL version in Minecraft's version JSON: platform-desktop compiles against
# these jars, and the game runs with Mojang's copies of the same version.
lwjgl = "3.4.3"
# Must match the Netty version in Minecraft's version JSON: :net compiles against these jars, and
# the game runs with Mojang's copies of the same version.
netty = "4.2.16.Final"
asm = "9.11.1"
# The Via stack the client runs (ADR 0017): ViaVersion translates for older servers,
# ViaBackwards for newer ones. Pinned together: ViaBackwards is built against this ViaVersion.
viaversion = "5.12.1"
viabackwards = "5.12.1"
# Must match the version in Minecraft's version JSON: :via compiles against it (Via's own signatures
# use it), and the game runs with Mojang's copy.
guava = "33.6.0-jre"
gson = "2.14.0"
jspecify = "1.0.1"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
# 2.99.0 needs javac internals from JDK 26+; the build runs on JDK 25.
palantir-java-format = "2.98.0"
# Annotations Mojang compiled against but doesn't ship. Compile-only, for the vendor tree.
jetbrains-annotations = "26.1.0"
jsr305 = "3.0.2"

[libraries]
vineflower = { module = "org.vineflower:vineflower", version.ref = "vineflower" }
teavm-tooling = { module = "org.teavm:teavm-tooling", version.ref = "teavm" }
teavm-core = { module = "org.teavm:teavm-core", version.ref = "teavm" }
teavm-classlib = { module = "org.teavm:teavm-classlib", version.ref = "teavm" }
teavm-jso = { module = "org.teavm:teavm-jso", version.ref = "teavm" }
teavm-jso-apis = { module = "org.teavm:teavm-jso-apis", version.ref = "teavm" }
teavm-jso-impl = { module = "org.teavm:teavm-jso-impl", version.ref = "teavm" }
teavm-interop = { module = "org.teavm:teavm-interop", version.ref = "teavm" }
teavm-extension-spi = { module = "org.teavm:teavm-extension-spi", version.ref = "teavm" }
teavm-wasm-gc-deobfuscator = { module = "org.teavm:teavm-wasm-gc-deobfuscator", version.ref = "teavm" }
# The deflate engine under TeaVM 0.16's zip classes, in the version teavm-classlib depends on.
jzlib = { module = "com.jcraft:jzlib", version = "1.1.3" }
# java.time for the browser build: TeaVM's class library maps java.time onto it.
threetenbp = { module = "org.threeten:threetenbp", version = "1.7.5" }
# The SLF4J API Minecraft ships; web-classlib binds it to the console.
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.17" }
# The command-line parser Minecraft ships; web-classlib replaces its reflective converter lookup.
jopt-simple = { module = "net.sf.jopt-simple:jopt-simple", version = "5.0.4" }
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl = { module = "org.lwjgl:lwjgl" }
lwjgl-sdl = { module = "org.lwjgl:lwjgl-sdl" }
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb" }
lwjgl-freetype = { module = "org.lwjgl:lwjgl-freetype" }
netty-common = { module = "io.netty:netty-common", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-codec-base = { module = "io.netty:netty-codec-base", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
# The WebSocket server side, for tests and the development bridge (tools/wsbridge) only.
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
viaversion = { module = "com.viaversion:viaversion-common", version.ref = "viaversion" }
viabackwards = { module = "com.viaversion:viabackwards-common", version.ref = "viabackwards" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.4" }
errorprone = { id = "net.ltgt.errorprone", version = "5.1.1" }
