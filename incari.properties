# The Minecraft release this tree targets. `incari fetch` refuses anything that doesn't match
# these hashes, so every machine decompiles the exact same bytes and the patches apply
# everywhere. Update all three lines together when moving to a new drop.
minecraft.version=26.3
minecraft.versionJson.sha1=11f1aefe473eefba0af62e3286c33b692807b2eb
minecraft.client.sha1=e877b6a07acd633fb3bb475002175cec036e7b87

# The Incari online service's WebSocket URL (ADR 0058), built into the client; empty turns accounts
# off. -Pincari.online.url overrides it at build time, ?online= and -Pincari.online at run time.
incari.online.url=wss://backend.incariclient.org/v1/ws

# This tree's Incari Client version (one to four numbers: 0.2.0) and its public repository. A
# release build (-Pteavm.release) whose version is older than the latest release the online service
# names shows an update notice on the title screen, linking here. Raise the version with each release.
incari.version=0.1.2
incari.repository=https://github.com/incari-client/incari-client

# The servers pinned atop the server list, marked Sponsored, that players can't delete (ADR 0062):
# "name|address" entries joined by ";". The online service's hello may replace them for a run. Empty
# for none (a self-hosted build may want its own).
incari.featured=Carrotcraft|wss://eagler.carrot-craft.org
